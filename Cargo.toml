[workspace]
members = [
  "core",
  "constraint-exporter",
  "field",
  "maybe_rayon",
  "plonky2",
  "starky",
  "unroll",
  "util",
  "verifier",
]
default-members = [
  "core",
  "field",
  "maybe_rayon",
  "plonky2",
  "starky",
  "unroll",
  "util",
  "verifier",
]
resolver = "2"

[workspace.dependencies]
anyhow = { version = "=1.0.104", default-features = false }
# `default-hasher` is foldhash, seeded once per process (as ahash was before).
# Nothing here depends on map iteration order, so that is fine.
hashbrown = { version = "=0.17.1", default-features = false, features = [
  "default-hasher",
  "serde",
] }
itertools = { version = "=0.15.0", default-features = false }
log = { version = "=0.4.35", default-features = false }
num = { version = "=0.4.3", default-features = false }
rand = { version = "=0.10.3", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = [
  "derive",
] }
static_assertions = { version = "=1.1.0", default-features = false }

[profile.release]
opt-level = 3
incremental = true
#lto = "fat"
#codegen-units = 1

[profile.bench]
opt-level = 3

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Quantus-Network/qp-plonky2"
repository = "https://github.com/Quantus-Network/qp-plonky2"
keywords = ["cryptography", "SNARK", "FRI", "plonky2", "quantus-network"]
categories = ["cryptography"]

[workspace.lints.clippy]
too_long_first_doc_paragraph = "allow"
