---
# The full Lean build on demand: adding `formal-full` (or `release-proposal`) to an open
# pull request runs `formal.yml` with the production public wrapper (`n_inner = 86`),
# which `ci.yml` builds on pull requests only when they carry one of those labels at
# push time. A separate workflow so that other labels never create check runs under
# CI's names: for them the one job here is skipped, and they fall into a concurrency
# group of their own so that they cannot cancel a full build in progress.
name: Formal (full)

on:
  pull_request:
    types: [labeled]

concurrency:
  group: formal-full-${{ github.event.pull_request.number }}-${{ github.event.label.name == 'formal-full' || github.event.label.name == 'release-proposal' }}
  cancel-in-progress: true

jobs:
  formal:
    name: 📐 Formal (full)
    if: github.event.label.name == 'formal-full' || github.event.label.name == 'release-proposal'
    uses: ./.github/workflows/formal.yml
    with:
      full: true
