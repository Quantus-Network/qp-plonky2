---
name: Continuous Integration

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  fast-checks:
    name: 🏁 Fast Checks (Format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Run format checks
        run: cargo +nightly fmt --all -- --check

  build-and-test-matrix:
    name: 🛠️ Build & Test Matrix
    needs: fast-checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -yqq
          sudo apt-get install -yqq --no-install-recommends \
            libclang-dev \
            protobuf-compiler
      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install protobuf
      - name: Add wasm32v1-none target
        run: rustup target add wasm32v1-none
      - name: Build
        run: cargo build --release
      # wasm32v1-none has no `std` at all, so this fails if anything in the
      # no-default-features graph links std (a host-target check passes vacuously).
      - name: Check no-std (without rand)
        run: |
          cargo check --package qp-plonky2 --no-default-features --target wasm32v1-none
          cargo check --package qp-plonky2-verifier --no-default-features --target wasm32v1-none
      - name: Test
        run: cargo test --release
      # The constraint exporter is a formal-verification dev tool (not in
      # `default-members`, so the commands above skip it). Its differential tests
      # check, at random points, that (a) the symbolically-extracted gate constraints
      # match the real `GoldilocksField` `eval_unfiltered`, (b) the extracted Poseidon2
      # primitives match the real helpers, and (c) the Lean sponge model's wrapper
      # matches `Poseidon2Hash::hash_no_pad` — the Rust half of the guarantees whose
      # Lean half is the `Bridges/*Bridge.lean` `ring` lemmas and `Sponge.lean`.
      - name: Test constraint exporter (extraction == real gate)
        run: cargo test --release -p qp-plonky2-constraint-exporter
      # Guard against a stale committed generated Lean: regenerate from the live
      # gate code and fail if it differs from what is checked in. Run once (Linux).
      - name: Check generated Lean is up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run --release -p qp-plonky2-constraint-exporter --bin export-constraints >/dev/null
          git diff --exit-code -- formal/Plonky2Spec/Generated/ formal/Plonky2Bridge/Generated/ \
            || (echo "::error::formal/*/Generated/ is stale; rerun the exporter" && exit 1)

  analysis:
    name: 🤖 Analysis (Doc)
    needs: fast-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Install dependencies
        run: |
          sudo apt-get update -yqq
          sudo apt-get install -yqq --no-install-recommends \
            libclang-dev \
            protobuf-compiler
      - name: Install required components
        run: rustup component add rust-src
      - name: Run doc
        run: cargo doc --no-deps

  # The Lean side: `formal.yml`, one job building the spec, the bridge and the axiom
  # gate from scratch (only mathlib's `.olean`s are fetched), skipped for pull requests
  # that leave the formal inputs as `main` built them. `full` adds the production public
  # wrapper (`n_inner = 89`, most of the build): on pushes to `main` and on release pull
  # requests. Adding `formal-full` or `release-proposal` to an open pull request runs it
  # through `formal-full.yml`.
  formal:
    name: 📐 Formal
    uses: ./.github/workflows/formal.yml
    with:
      full: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release-proposal') || contains(github.event.pull_request.labels.*.name, 'formal-full') }}

  security-audit:
    name: 🔒 Security Audit
    needs: fast-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run security audit
        run: cargo audit
