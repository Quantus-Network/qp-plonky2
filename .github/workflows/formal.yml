---
# The Lean side of CI, one job: the gadget→constraint model (`Plonky2Spec`, the default
# target), the cross-package bridge (`Plonky2Bridge`, wormholeSpec pinned in
# lake-manifest.json), the vendored-trace check, and the axiom-footprint gate. The bridge
# build reuses the spec's `.olean`s, so one job is half the CPU of two.
#
# A pull request that leaves `formal/`, the vendored traces and this file as they are at
# its merge base has nothing for Lean to check: `main` built that tree, and the cargo job's
# `*_lean_is_current` tests fail if the Rust gates drift from the checked-in Lean. `scope`
# skips the Lean job for such pull requests (a skipped job satisfies a required check).
#
# The package's own `.lake/build` is cached between runs (mathlib's comes from
# `lake exe cache get`). Lake rebuilds by content hash, so a restored cache skips every
# module whose sources are unchanged; the key is exact on the sources, with a fallback to
# the most recent cache for the same toolchain and manifest — on a pull request, `main`'s,
# since a branch sees only its own entries and `main`'s. This is the only cache the job
# writes: `lean-action`'s own, keyed by commit and 3 GB a piece, is turned off because a
# few of them evict everything else under the repository's 10 GB cap. A change to a module
# everything imports (`Plonky2Spec/Wiring.lean`) still pays a cold build, once.
#
# The production wrappers (`Plonky2BridgeProduction`: the `n_inner = 89` public wrapper,
# some 20,000 generated gadget-fact theorems and 89 forwarding modules, and the 8-leaf
# private wrapper, whose build certificate is over half of a cold build) are built only
# with `full`: `ci.yml` sets it on pushes to `main` and on pull requests carrying
# `release-proposal` or `formal-full`; `formal-full.yml` sets it when one of those labels
# is added to an open pull request. Every pull request builds the `n_inner = 2` and `4`
# and `n = 2` and `4` shapes of the same capstones.
name: Formal

on:
  workflow_call:
    inputs:
      full:
        description: Also build and gate the production public wrapper (n_inner = 89).
        required: true
        type: boolean

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          FULL: ${{ inputs.full }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$FULL" = true ] || [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo build=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          merge_base=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")
          if git diff --quiet "$merge_base" "$HEAD_SHA" -- \
              formal constraint-exporter/traces .github/workflows/formal.yml; then
            echo "formal inputs are those of $merge_base, which main has built; nothing to check"
            echo build=false >> "$GITHUB_OUTPUT"
          else
            echo build=true >> "$GITHUB_OUTPUT"
          fi

  formal:
    name: Lean
    needs: scope
    if: needs.scope.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      FORMAL_FULL: ${{ inputs.full }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore Lean build cache
        id: lean-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            formal/.lake/build
            formal/.lake/packages/wormholeSpec/formal/.lake/build
          key: lean-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json') }}-${{ hashFiles('formal/**/*.lean') }}
          restore-keys: |
            lean-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json') }}-
      # Builds the Lean 4 gadget→constraint model under `formal/` (see formal/PLAN.md).
      # `lake build` type-checks every proof in the kernel, so a later edit that
      # breaks a proof fails CI instead of rotting silently. elan/lake come from
      # `formal/lean-toolchain` (Lean v4.30). `leanchecker` re-checks the compiled
      # environment with an independent kernel checker (bundled on v4.30).
      #
      # The package depends on mathlib (pinned to v4.30.0) for the `ZMod p` field
      # model, so `use-mathlib-cache: true` makes the action fetch the prebuilt
      # `.olean` cache instead of compiling mathlib from source.
      - name: Build formal spec (lake build)
        # Pinned to a full commit SHA (supply-chain hardening). 38fbc41 == v1.5.0.
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: "formal"
          use-mathlib-cache: "true"
          use-github-cache: "false"
          leanchecker: "true"
      # No-`sorry` gate: the model must stay gap-free. Fail if any proof term uses a
      # `sorry`/`admit`/`sorryAx` placeholder. Exclude `.lake/` — after `lake build`
      # mathlib (and other deps) live there and legitimately contain `sorry` in tactic
      # docs/examples. (Keep those literal words out of comments/strings in our sources
      # under `formal/` so this stays a clean signal.)
      - name: Assert the spec contains no sorry/admit
        run: |
          if grep -rEn '\b(sorry|admit|sorryAx)\b' --include='*.lean' formal --exclude-dir=.lake; then
            echo "::error::formal spec contains a sorry/admit placeholder"
            exit 1
          fi

      # The headline deliverables (`Plonky2Bridge.private_batch_end_to_end` and
      # `Plonky2Bridge.public_batch_end_to_end`) live outside `defaultTargets`. Build the
      # cross-package bridge, and the production wrapper on full runs; the gate below
      # asserts each capstone's axiom footprint is exactly the standard Lean axioms plus,
      # where the theorem consumes an accepted proof, the declarations `proof_sound`
      # rests on (none for the leaf wiring capstone, the base of the recursion) — not
      # e.g. `sorryAx`, `Lean.ofReduceBool`, or a silent compile failure.
      - name: Build Plonky2Bridge (cross-package capstone)
        run: cd formal && lake build Plonky2Bridge
      - name: Build Plonky2BridgeProduction (n_inner = 89)
        if: env.FORMAL_FULL == 'true'
        run: cd formal && lake build Plonky2BridgeProduction
      # Save whatever was built, even after a failure, so the next run resumes from it.
      # An exact hit needs no save; a save on an existing key is a no-op with a warning.
      - name: Save Lean build cache
        if: always() && steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            formal/.lake/build
            formal/.lake/packages/wormholeSpec/formal/.lake/build
          key: ${{ steps.lean-cache.outputs.cache-primary-key }}
      # The exporter's `Generated/*Wrapper*.lean` are produced from the vendored copies of
      # the qp-zk-circuits gadget-call traces in `constraint-exporter/traces/`. The only job
      # with the pinned `wormholeSpec` package on disk is this one (after `lake build`), so
      # this is where vendored == pinned is enforced; `FORMAL_TRACES_STRICT` turns the
      # tests' "package not fetched" skip into a failure.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Assert vendored traces match the pinned wormholeSpec package
        env:
          FORMAL_TRACES_STRICT: "1"
        run: |
          cargo test -p qp-plonky2-constraint-exporter \
            --test private_batch_wrapper --test public_batch_wrapper --test leaf_circuit \
            vendored_trace_matches_pinned_package -- --nocapture
      - name: Assert capstone axiom footprints
        run: |
          set -euo pipefail
          cd formal
          output=$(lake env lean ci/AxiomsCheck.lean 2>&1)
          if [ "$FORMAL_FULL" = true ]; then
            output+=$'\n'$(lake env lean ci/AxiomsCheckProduction.lean 2>&1)
          fi
          printf '%s\n' "$output"
          # expect <theorem> <axiom...>: the footprint must be exactly the named axioms.
          # `proof_sound` is a theorem. Its footprint is the standard propositional axioms
          # plus the three assumptions and what is left of `verifier_algebra`: the two
          # child obligations and the public-input binding assumption. Nothing is declared
          # of `build` for every circuit (Step 20): `proof_sound` takes the built system's
          # refinement and public-input hashing as hypotheses, which a certified circuit
          # supplies from its `build_agrees`. The assumptions are implications on their
          # good events (`GoodEvents`), taken as hypotheses, not axioms.
          expect() {
            local thm="$1"
            shift
            local block axioms expected
            block=$(awk -v pat="'$thm' depends on axioms:" \
              'index($0, pat) { f = 1 } f { printf "%s", $0; if (index($0, "]")) exit }' <<< "$output")
            if [ -z "$block" ]; then
              echo "::error::could not read #print axioms for $thm"
              exit 1
            fi
            axioms=$(sed 's/.*\[\(.*\)\].*/\1/' <<< "$block" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | sort)
            expected=$(printf '%s\n' "$@" | sort)
            if [ "$axioms" != "$expected" ]; then
              echo "::error::$thm axiom footprint mismatch"
              echo "expected exactly:"
              printf '  %s\n' "$expected"
              echo "got:"
              printf '  %s\n' "$axioms"
              exit 1
            fi
          }
          base=(propext Classical.choice Quot.sound)
          assumptions=(
            Plonky2Bridge.poseidon_transcript_oracle
            Plonky2Bridge.fri_proximity_gap
            Plonky2Bridge.algebraic_sampling
          )
          children=(Plonky2Bridge.recursive_verifier_transcript)
          binding=(Plonky2Bridge.public_input_binding)
          algebra=("${children[@]}" "${binding[@]}")
          trusted=("${assumptions[@]}" "${algebra[@]}")
          # The leaf's and the private wrappers' builds are certified (Steps 16, 17, 19
          # and 21), each resting on one per-circuit trusted declaration
          # (`LeafCircuit.build_agrees`, `Wrapper{n}.build_agrees`). The leaf has no
          # children, so its path through `proof_sound_leaf` has no child obligation; the
          # private-wrapper capstones on wiring read only leaf proofs, so they have the
          # leaf's footprint too. Anything that reads an `n`-leaf wrapper proof
          # (`Wrapper{n}.accepted_sound`, the public-wrapper capstones) goes through
          # `proof_sound` and is the assumptions, the binding, the child obligation on the
          # complete export, and the leaf's and that wrapper's certificates.
          leaf_trusted=("${assumptions[@]}" "${binding[@]}")
          leaf_cert=(Plonky2Bridge.LeafCircuit.build_agrees)
          wrapper_trusted=("${leaf_trusted[@]}" "${children[@]}" "${leaf_cert[@]}")
          expect Plonky2Bridge.proof_sound "${base[@]}" "${trusted[@]}"
          expect Plonky2Bridge.verifier_algebra "${base[@]}" "${algebra[@]}"
          expect Plonky2Bridge.identical_constraints_satisfies "${base[@]}"
          expect Plonky2Bridge.Built.Refines.satisfies "${base[@]}"
          expect Plonky2Bridge.poseidon2_gate_rows "${base[@]}"
          expect Plonky2Bridge.poseidon_gate_rows "${base[@]}"
          expect Plonky2Spec.Poseidon.gate_sound_complete "${base[@]}"
          expect Plonky2Spec.Poseidon.goldilocks_perm_test "${base[@]}"
          expect Plonky2Bridge.publicInputsHash_test "${base[@]}"
          expect Plonky2Bridge.proof_sound_leaf "${base[@]}" "${leaf_trusted[@]}"
          expect Plonky2Bridge.Built.Agrees.refines propext Quot.sound
          expect Plonky2Bridge.LeafCircuit.build_refines_of_agrees propext Quot.sound
          expect Plonky2Bridge.LeafCircuit.build_refines propext Quot.sound "${leaf_cert[@]}"
          expect Plonky2Bridge.Built.HashesPublicInputs.hash_eq "${base[@]}"
          expect Plonky2Bridge.Built.Agrees.hashesPublicInputs propext Quot.sound
          expect Plonky2Bridge.LeafCircuit.build_hashes_of_agrees propext Quot.sound
          expect Plonky2Bridge.LeafCircuit.build_hashes propext Quot.sound "${leaf_cert[@]}"
          wrapper_sizes=(2 4)
          if [ "$FORMAL_FULL" = true ]; then
            wrapper_sizes+=(8)
          fi
          for n in "${wrapper_sizes[@]}"; do
            expect Plonky2Bridge.Wrapper$n.build_refines_of_agrees propext Quot.sound
            expect Plonky2Bridge.Wrapper$n.build_hashes_of_agrees propext Quot.sound
            expect Plonky2Bridge.Wrapper$n.build_refines propext Quot.sound Plonky2Bridge.Wrapper$n.build_agrees
            expect Plonky2Bridge.Wrapper$n.build_hashes propext Quot.sound Plonky2Bridge.Wrapper$n.build_agrees
            expect Plonky2Bridge.Wrapper$n.build_complete propext Quot.sound Plonky2Bridge.Wrapper$n.build_agrees
            expect Plonky2Bridge.Wrapper$n.sound "${base[@]}"
            expect Plonky2Bridge.Wrapper$n.accepted_sound "${base[@]}" "${wrapper_trusted[@]}" Plonky2Bridge.Wrapper$n.build_agrees
          done
          expect Plonky2Bridge.private_batch_end_to_end "${base[@]}"
          expect Plonky2Bridge.public_batch_end_to_end "${base[@]}"
          expect Plonky2Bridge.private_batch_end_to_end_wired "${base[@]}" "${leaf_trusted[@]}" "${leaf_cert[@]}"
          expect Plonky2Bridge.private_batch_end_to_end_wired_n4 "${base[@]}" "${leaf_trusted[@]}" "${leaf_cert[@]}"
          expect Plonky2Bridge.public_batch_end_to_end_wired "${base[@]}" "${wrapper_trusted[@]}" Plonky2Bridge.Wrapper2.build_agrees
          expect Plonky2Bridge.public_batch_end_to_end_wired_n4 "${base[@]}" "${wrapper_trusted[@]}" Plonky2Bridge.Wrapper2.build_agrees
          expect Plonky2Bridge.LeafCircuit.accepted_sound "${base[@]}" "${leaf_trusted[@]}" "${leaf_cert[@]}"
          expect Plonky2Bridge.PublicWrapper2.sound "${base[@]}"
          expect Plonky2Bridge.PublicWrapper4.sound "${base[@]}"
          expect Plonky2Bridge.leaf_wired "${base[@]}"
          expect Plonky2Bridge.LeafCircuit.sound "${base[@]}"
          if [ "$FORMAL_FULL" = true ]; then
            expect Plonky2Bridge.private_batch_end_to_end_wired_production "${base[@]}" "${leaf_trusted[@]}" "${leaf_cert[@]}"
            expect Plonky2Bridge.public_batch_end_to_end_wired_production "${base[@]}" "${wrapper_trusted[@]}" Plonky2Bridge.Wrapper8.build_agrees
            expect Plonky2Bridge.PublicWrapper89.sound "${base[@]}"
          fi
